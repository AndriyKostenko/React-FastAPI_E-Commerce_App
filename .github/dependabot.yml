# Weekly dependency updates, grouped so one maintainer gets a handful of PRs
# rather than dozens. Security updates still arrive on their own, at once.
#
# Minor and patch updates come grouped; a major comes as its own PR, per
# directory, since each is a migration to judge alone. Majors that cannot
# land yet are ignored below, each with the reason, so they stop reopening
# every week: remove the entry when its reason is gone.
#
# Each block waits a week after a release (a month for a major) before
# proposing it: a broken or hijacked release is usually pulled by then, and a
# package republishing several patches in a week becomes one PR, not several.
# Security updates skip the wait.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directories:
      - /backend/api_gateway
      - /backend/user_service
      - /backend/product_service
      - /backend/supplier_service
      - /backend/order_service
      - /backend/payment_service
      - /backend/cart_service
      - /backend/wishlist_service
      - /backend/shipping_service
      - /backend/notification_service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /frontend
      - /backend/admin-js-service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # admin-js lints with a legacy .eslintrc and eslint-config-airbnb, which
      # stop at ESLint 8: a major bump (#29, ESLint 10) broke `npm ci`. Move
      # to ESLint 9+ by hand, with a flat config, then drop this. (It covers
      # the frontend too, which has no ESLint config yet.)
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Same reason: eslint-config-airbnb 19 wants eslint-plugin-react-hooks ^4 (#68).
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (#66, #69): openapi-typescript allows ^5 and
      # typescript-eslint stops below 6.1, so `npm ci` cannot resolve it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The Node types follow the Node we run (22 for the frontend, 20 for
      # admin-js), not the newest Node (#67, #70): types ahead of the runtime
      # let code call what is not there. Raise them with the Node image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Express 5 (#65) changes route and request types and has to be tried
      # against AdminJS by hand (express-formidable, passkey sign-in).
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
