# Settings for the backend test suites in CI, one KEY=value per line
# (GitHub's $GITHUB_ENV format; list fields are JSON).
#
# CI has no backend/.env and no Vault: these non-secret test values stand in
# for both. The passwords for Postgres, Redis and RabbitMQ, and the S3 keys,
# are generated for each run by ci/prepare.sh and never written here. Ports
# are the ones ci/docker-compose.ci.yml publishes on 127.0.0.1.

# Application
WEBSITE_NAME=E-Commerce CI
APP_HOST=localhost
FRONTEND_URL=http://localhost:30000
DEBUG_MODE=false
SECURE_COOKIES=false
ALLOWED_HOSTS=["localhost","127.0.0.1","testserver"]
SECRET_ROLE=admin
OTEL_TRACES_DISABLED=true
PYTHONUNBUFFERED=1

# Ports and service addresses
API_GATEWAY_SERVICE_APP_PORT=8000
USER_SERVICE_APP_PORT=8001
PRODUCT_SERVICE_APP_PORT=8002
NOTIFICATION_SERVICE_APP_PORT=8003
ORDER_SERVICE_APP_PORT=8005
PAYMENT_SERVICE_APP_PORT=8006
CART_SERVICE_APP_PORT=8007
SHIPPING_SERVICE_APP_PORT=8008
WISHLIST_SERVICE_APP_PORT=8009
SUPPLIER_SERVICE_APP_PORT=8010
USER_SERVICE_URL=http://127.0.0.1:8001
PRODUCT_SERVICE_URL=http://127.0.0.1:8002
NOTIFICATION_SERVICE_URL=http://127.0.0.1:8003
ORDER_SERVICE_URL=http://127.0.0.1:8005
PAYMENT_SERVICE_URL=http://127.0.0.1:8006
CART_SERVICE_URL=http://127.0.0.1:8007
SHIPPING_SERVICE_URL=http://127.0.0.1:8008
WISHLIST_SERVICE_URL=http://127.0.0.1:8009
SUPPLIER_SERVICE_URL=http://127.0.0.1:8010
API_GATEWAY_SERVICE_URL_API_VERSION=/api/v1
USER_SERVICE_URL_API_VERSION=/api/v1
PRODUCT_SERVICE_URL_API_VERSION=/api/v1
NOTIFICATION_SERVICE_URL_API_VERSION=/api/v1
ORDER_SERVICE_URL_API_VERSION=/api/v1
PAYMENT_SERVICE_URL_API_VERSION=/api/v1
CART_SERVICE_URL_API_VERSION=/api/v1
SHIPPING_SERVICE_URL_API_VERSION=/api/v1
WISHLIST_SERVICE_URL_API_VERSION=/api/v1
SUPPLIER_SERVICE_URL_API_VERSION=/api/v1

# Postgres (databases created by backend/db/init-databases.sql)
POSTGRES_USER=postgres
POSTGRES_HOST=127.0.0.1
POSTGRES_PORT=5432
USER_SERVICE_DB=user_service_db
PRODUCT_SERVICE_DB=product_service_db
NOTIFICATION_SERVICE_DB=notification_service_db
ORDER_SERVICE_DB=order_service_db
PAYMENT_SERVICE_DB=payment_service_db
CART_SERVICE_DB=cart_service_db
SHIPPING_SERVICE_DB=shipping_service_db
WISHLIST_SERVICE_DB=wishlist_service_db
SUPPLIER_SERVICE_DB=supplier_service_db
USER_SERVICE_TEST_DB=user_service_test_db
PRODUCT_SERVICE_TEST_DB=product_service_test_db
NOTIFICATION_SERVICE_TEST_DB=notification_service_test_db
ORDER_SERVICE_TEST_DB=order_service_test_db
PAYMENT_SERVICE_TEST_DB=payment_service_test_db
CART_SERVICE_TEST_DB=cart_service_test_db
SHIPPING_SERVICE_TEST_DB=shipping_service_test_db
WISHLIST_SERVICE_TEST_DB=wishlist_service_test_db
SUPPLIER_SERVICE_TEST_DB=supplier_service_test_db

# RabbitMQ and Redis
RABBITMQ_HOST=127.0.0.1
RABBITMQ_PORT=5672
RABBITMQ_USER=ci
REDIS_HOST=127.0.0.1
REDIS_PORT=6379
APIGATEWAY_SERVICE_REDIS_DB=0
USER_SERVICE_REDIS_DB=1
PRODUCT_SERVICE_REDIS_DB=2
NOTIFICATION_SERVICE_REDIS_DB=3
ORDER_SERVICE_REDIS_DB=4
PAYMENT_SERVICE_REDIS_DB=5
CART_SERVICE_REDIS_DB=6
SHIPPING_SERVICE_REDIS_DB=7
WISHLIST_SERVICE_REDIS_DB=8
SUPPLIER_SERVICE_REDIS_DB=9
NOTIFICATION_SERVICE_REDIS_BACKEND_RESULT_DB=10
PRODUCT_SERVICE_REDIS_PREFIX=product
NOTIFICATION_SERVICE_REDIS_PREFIX=notification
SUPPLIER_SERVICE_REDIS_PREFIX=supplier
IDEMPOTENCY_EVENT_SERVICE_HOURS=24

# User sessions
TOKEN_TYPE=bearer
TOKEN_TIME_DELTA_MINUTES=20
REFRESH_TOKEN_TIME_DELTA_DAYS=7
RESET_TOKEN_EXPIRY_MINUTES=30
VERIFICATION_TOKEN_EXPIRY_MINUTES=60
CRYPT_CONTEXT_SCHEME=bcrypt
GOOGLE_CLIENT_ID=ci-google-client-id
# Cloudflare's published always-pass Turnstile test secret (not a secret).
TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA

# CORS
CORS_ALLOWED_ORIGINS=["http://localhost:30000"]
CORS_ALLOW_CREDENTIALS=true
CORS_ALLOWED_METHODS=["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
CORS_ALLOWED_HEADERS=["*"]

# Email (the suites never send: no server listens here)
MAIL_USERNAME=ci
MAIL_PORT=1025
MAIL_SERVER=127.0.0.1
MAIL_STARTTLS=false
MAIL_SSL_TLS=false
MAIL_DEBUG=false
MAIL_FROM=noreply@example.com
MAIL_FROM_NAME=E-Commerce CI
USE_CREDENTIALS=false
VALIDATE_CERTS=false

# Products and images
CUSTOM_TSHIRT_BASE_PRICE=25
OPENROUTER_BASE_URL=https://openrouter.invalid/api/v1
OPENROUTER_IMAGE_MODEL=ci-image-model
MEDIA_ROOT=/tmp/ci-media
RETURN_EVIDENCE_ROOT=/tmp/ci-private-media

# Object storage: SeaweedFS from ci/docker-compose.ci.yml, the test buckets
OBJECT_STORAGE_BACKEND=s3
AWS_S3_ENDPOINT_URL=http://127.0.0.1:8333
AWS_S3_REGION=us-east-1
AWS_S3_CATALOGUE_BUCKET=ecommerce-catalogue-test
AWS_S3_PRIVATE_BUCKET=ecommerce-private-test
AWS_S3_CATALOGUE_PUBLIC_BASE_URL=http://127.0.0.1:8333/ecommerce-catalogue-test
