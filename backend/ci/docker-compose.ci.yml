# What a backend test suite talks to in CI, started by ci/prepare.sh.
#
# Same images as docker-compose.yml (and SeaweedFS at the version dev.sh runs
# locally). Every password and key comes from the environment ci/prepare.sh
# generates for the run; nothing secret is written in this file. Ports are
# published on 127.0.0.1 only and can be moved (CI_*_PORT) to rehearse beside
# a running local stack.

name: ecommerce-ci

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD:?generated by ci/prepare.sh}
    volumes:
      - ../db/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "127.0.0.1:${CI_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP: while the init script creates the databases, the image runs a
      # temporary server on the socket only, so TCP answers once all exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${CI_REDIS_PASSWORD:?generated by ci/prepare.sh}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${CI_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ci
      RABBITMQ_DEFAULT_PASS: ${CI_RABBITMQ_PASSWORD:?generated by ci/prepare.sh}
    ports:
      - "127.0.0.1:${CI_RABBITMQ_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 10s
      retries: 40

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # The identities file (one key per service, scoped to its bucket or prefix;
    # anonymous read on the catalogue bucket only) is rendered by
    # local/s3_local.py, exactly as dev.sh does; the key that encrypts objects
    # at rest comes from the same run.
    environment:
      WEED_S3_SSE_KEK: ${CI_SEAWEEDFS_SSE_KEK:?generated by ci/prepare.sh}
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=128
      - -volume.max=64
      - -s3
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ${CI_SEAWEEDFS_CONFIG:?generated by ci/prepare.sh}:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:${CI_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 2s
      timeout: 3s
      retries: 30
