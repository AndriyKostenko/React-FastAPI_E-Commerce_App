    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VAULT_ADDR: http://host.docker.internal:8200
      VAULT_ROLE_ID_FILE: /run/vault/role-id
      VAULT_SECRET_ID_FILE: /run/vault/secret-id
      VAULT_SECRET_PATHS: ecommerce/shared-infra,ecommerce/product-service
      OTEL_TRACES_DISABLED: ${OTEL_TRACES_DISABLED:-true}
      DB_POOL_SIZE: 3
      DB_MAX_OVERFLOW: 2
      GUNICORN_WORKERS: 1
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc/product-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MEDIA_ROOT: /media
    volumes:
      - ${VAULT_CREDENTIALS_DIR:-/etc/ecommerce/vault}/product-service:/run/vault:ro
      - product_media:/media
      - /tmp/prometheus_multiproc:/tmp/prometheus_multiproc
