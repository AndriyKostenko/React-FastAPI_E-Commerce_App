  product-taskiq-worker:
    mem_limit: 384m
    image: ${IMAGE_REGISTRY:-local}/ecommerce-product-taskiq-worker:${IMAGE_TAG:-dev}
    build:
      context: ./product_service
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    labels:
      # Engines this container may hold at once: the catalogue mirror opens an engine per sweep; allows one overlap.
      ecommerce.db.max-engines: "2"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
