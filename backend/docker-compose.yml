      context: ./supplier_service
      dockerfile: Dockerfile.scheduler
    restart: unless-stopped
    labels:
      # Engines this container may hold at once: uses no database.
      ecommerce.db.max-engines: "0"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      supplier-taskiq-worker:
