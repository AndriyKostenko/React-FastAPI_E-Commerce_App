      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${VAULT_CREDENTIALS_DIR:-/etc/ecommerce/vault}/supplier-service:/run/vault:ro
    extra_hosts:
