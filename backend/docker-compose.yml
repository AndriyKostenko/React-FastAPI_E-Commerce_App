services:
  db:
    mem_limit: 1g
    image: postgres:16-alpine
    restart: always
    ports:
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:5432:5432"
    env_file:
      - .env
    # Sized for a 2-CPU / 8 GB host: Postgres runs only a handful of queries at
    # once there, so bigger pools would just queue inside it. Every process's
    # pool (DB_POOL_SIZE + DB_MAX_OVERFLOW below) must fit in max_connections
    # minus a reserve for superuser, migrations, psql and backups; check with
    # `./local/dev.sh pool-budget` after adding a process or changing a pool.
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=4MB
        -c max_wal_size=1GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5

  pgadmin:
    mem_limit: 512m
    image: dpage/pgadmin4:latest
    restart: always
    env_file:
      - .env
    ports:
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:5050:80"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  redis:
    mem_limit: 256m
    image: redis:7-alpine
    restart: always
    ports:
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5

  rabbitmq:
    mem_limit: 768m
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:5672:5672"
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    env_file:
      - .env
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 60s
      timeout: 10s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api-gateway:
    mem_limit: 384m
    image: ${IMAGE_REGISTRY:-local}/ecommerce-api-gateway:${IMAGE_TAG:-dev}
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
      target: runtime
    restart: always
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      wishlist-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VAULT_ADDR: http://host.docker.internal:8200
      VAULT_ROLE_ID_FILE: /run/vault/role-id
      VAULT_SECRET_ID_FILE: /run/vault/secret-id
      VAULT_SECRET_PATHS: ecommerce/shared-infra,ecommerce/api-gateway
      OTEL_TRACES_DISABLED: ${OTEL_TRACES_DISABLED:-true}
      GUNICORN_WORKERS: 1
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc/api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ${VAULT_CREDENTIALS_DIR:-/etc/ecommerce/vault}/api-gateway:/run/vault:ro
      - /tmp/prometheus_multiproc:/tmp/prometheus_multiproc
    ports:
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:8000:8000"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      # Main app router: handles all traffic for the apex domain and www (www redirects to apex).
      # Same origin as the storefront: the gateway owns the API paths and the
      # frontend (below) takes everything else on the apex. /health is kept
      # because the external uptime check reads it.
      - "traefik.http.routers.api-gateway.rule=(Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)) && (PathPrefix(`/api/`) || PathPrefix(`/media/`) || Path(`/health`) || Path(`/docs`) || Path(`/openapi.json`))"
      - "traefik.http.routers.api-gateway.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.api-gateway.tls.certresolver=${CERT_RESOLVER:-}"
      - "traefik.http.routers.api-gateway.middlewares=www-to-apex@file,limit-body-size@file,rate-limit-api@file,compress@file"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=8000"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.api-gateway.loadbalancer.passHostHeader=true"

  user-service:
    mem_limit: 256m
    image: ${IMAGE_REGISTRY:-local}/ecommerce-user-service:${IMAGE_TAG:-dev}
    build:
      context: ./user_service
      dockerfile: Dockerfile
      target: runtime
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VAULT_ADDR: http://host.docker.internal:8200
      VAULT_ROLE_ID_FILE: /run/vault/role-id
      VAULT_SECRET_ID_FILE: /run/vault/secret-id
      VAULT_SECRET_PATHS: ecommerce/shared-infra,ecommerce/user-service
      OTEL_TRACES_DISABLED: ${OTEL_TRACES_DISABLED:-true}
      DB_POOL_SIZE: 3
      DB_MAX_OVERFLOW: 2
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc/user-service
      GUNICORN_WORKERS: 1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ${VAULT_CREDENTIALS_DIR:-/etc/ecommerce/vault}/user-service:/run/vault:ro
      - /tmp/prometheus_multiproc:/tmp/prometheus_multiproc
    ports:
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:8001:8001"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 60s
      timeout: 10s
      retries: 3

  user-outbox-worker:
    mem_limit: 192m
    image: ${IMAGE_REGISTRY:-local}/ecommerce-user-outbox-worker:${IMAGE_TAG:-dev}
    build:
      context: ./user_service
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "outbox_worker.py"]
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${VAULT_CREDENTIALS_DIR:-/etc/ecommerce/vault}/user-service:/run/vault:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VAULT_ADDR: http://host.docker.internal:8200
      VAULT_ROLE_ID_FILE: /run/vault/role-id
      VAULT_SECRET_ID_FILE: /run/vault/secret-id
      VAULT_SECRET_PATHS: ecommerce/shared-infra,ecommerce/user-service
      OTEL_TRACES_DISABLED: ${OTEL_TRACES_DISABLED:-true}
      DB_POOL_SIZE: 1
      DB_MAX_OVERFLOW: 1
    networks:
      - backend

  product-service:
    mem_limit: 384m
    image: ${IMAGE_REGISTRY:-local}/ecommerce-product-service:${IMAGE_TAG:-dev}
    build:
      context: ./product_service
      dockerfile: Dockerfile
      target: runtime
