      VAULT_ROLE_ID_FILE: /run/vault/role-id
      VAULT_SECRET_ID_FILE: /run/vault/secret-id
      VAULT_SECRET_PATHS: ecommerce/shared-infra,ecommerce/product-service
      OTEL_TRACES_DISABLED: ${OTEL_TRACES_DISABLED:-true}
      DB_POOL_SIZE: 1
      DB_MAX_OVERFLOW: 1
    networks:
