    environment:
      VAULT_ADDR: http://host.docker.internal:8200
      VAULT_ROLE_ID_FILE: /run/vault/role-id
      VAULT_SECRET_ID_FILE: /run/vault/secret-id
      VAULT_SECRET_PATHS: ecommerce/shared-infra,ecommerce/supplier-service
      OTEL_TRACES_DISABLED: ${OTEL_TRACES_DISABLED:-true}
      DB_POOL_SIZE: 1
      DB_MAX_OVERFLOW: 0
    networks:
      - backend

  supplier-taskiq-scheduler:
    mem_limit: 128m
    image: ${IMAGE_REGISTRY:-local}/ecommerce-supplier-taskiq-scheduler:${IMAGE_TAG:-dev}
    volumes:
      - ${VAULT_CREDENTIALS_DIR:-/etc/ecommerce/vault}/supplier-service:/run/vault:ro
