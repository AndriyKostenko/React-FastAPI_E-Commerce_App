  supplier-taskiq-worker:
    mem_limit: 192m
    image: ${IMAGE_REGISTRY:-local}/ecommerce-supplier-taskiq-worker:${IMAGE_TAG:-dev}
    build:
      context: ./supplier_service
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    labels:
      # Engines this container may hold at once: at most 5 tasks at once (--max-async-tasks 5), each with its own engine.
      ecommerce.db.max-engines: "5"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
    env_file:
