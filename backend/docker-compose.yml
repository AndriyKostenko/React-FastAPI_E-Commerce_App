  # Storefront (Next.js). Public values are build arguments: they are compiled
  # into the bundle, so changing them means rebuilding the image. Optional
  # values are passed in list form, so an unset variable stays unset and the
  # app falls back to its defaults (same-origin API, no optional keys).
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:30000}
        NEXT_PUBLIC_API_ORIGIN:
        NEXT_PUBLIC_API_VERSION: ${NEXT_PUBLIC_API_VERSION:-v1}
        NEXT_PUBLIC_STRIPE_TEST_PUBLISHABLE_KEY:
        NEXT_PUBLIC_STRIPE_PROD_PUBLISHABLE_KEY:
        CATALOGUE_IMAGE_HOST:
        NEXT_PUBLIC_INSTAGRAM_URL:
        NEXT_PUBLIC_FACEBOOK_URL:
    image: ${IMAGE_REGISTRY:-local}/ecommerce-frontend:${IMAGE_TAG:-dev}
    mem_limit: 256m
    restart: unless-stopped
    # Local runs reach it on localhost:30000; production publishes nothing and
    # Traefik serves it (docker-compose.prod.yml).
    ports:
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:30000:3000"
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      # Lower than the gateway's rule, which is longer, so API paths win.
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.frontend.tls.certresolver=${CERT_RESOLVER:-}"
      - "traefik.http.routers.frontend.middlewares=www-to-apex@file,compress@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  admin-js-service:
    mem_limit: 256m
    image: ${IMAGE_REGISTRY:-local}/ecommerce-admin-js-service:${IMAGE_TAG:-dev}
    build:
      context: ./admin-js-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      OTEL_TRACES_DISABLED: ${OTEL_TRACES_DISABLED:-true}
      # Inside its container it must accept the port mapping below; the
      # mapping is what keeps it private.
      ADMIN_JS_LISTEN_HOST: 0.0.0.0
    # Private only: never routed through Traefik. Published on the host's
    # loopback and reached over an SSH tunnel (ssh -L 3001:127.0.0.1:3001
    # <host>) or a VPN; passkeys are bound to that origin (WEBAUTHN_ORIGINS).
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - backend
    labels:
      - "traefik.enable=false"

  otel-collector:
    mem_limit: 256m
    profiles: ["tracing"]
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otel-collector.yml"]
    volumes:
      - ./observability/otelcollector/otel-collector.yml:/etc/otelcol/otel-collector.yml:ro
    ports:
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:4317:4317"
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:4318:4318"
    networks:
      - backend
    depends_on:
      - tempo

  tempo:
    mem_limit: 384m
    profiles: ["tracing"]
    image: grafana/tempo:2.7.2
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:3200:3200"
    networks:
      - backend

  prometheus:
    mem_limit: 512m
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/rules:/etc/prometheus/rules
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    depends_on:
      - alertmanager
    networks:
      - edge
      - backend

  alertmanager:
    mem_limit: 64m
    image: prom/alertmanager:v0.32.1
    ports: ["9093:9093"]
    volumes:
      - ./observability/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./observability/alertmanager/templates:/etc/alertmanager/templates:ro
      - ./observability/alertmanager/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    networks:
      - backend
    restart: unless-stopped

  grafana:
    mem_limit: 256m
    image: grafana/grafana:13.0.1-security-01
    ports: ["3002:3000"]
    environment:
      # Stable secret key prevents session invalidation on container restarts.
      # Generate once: python3 -c "import secrets; print(secrets.token_hex(32))"
      # then add GRAFANA_SECRET_KEY=<value> to your .env file.
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - edge
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.grafana.tls.certresolver=${CERT_RESOLVER:-}"
      - "traefik.http.routers.grafana.middlewares=admin-ip-allowlist@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  loki:
    mem_limit: 256m
    image: grafana/loki:3.7.2
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend

  promtail:
    mem_limit: 128m
    image: grafana/promtail:3.6.11
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - backend

  # CPU / RAM / net / disk metrics per container
  cadvisor:
    mem_limit: 128m
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    privileged: true          # required on modern kernels for full cgroup access
    ports: ["8080:8080"]
    devices:
      - /dev/kmsg             # kernel message ring buffer access
    volumes:
      - /:/rootfs:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro   # name-label resolution
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - --docker_only=true                      # skip non-Docker cgroups (system, init, etc.)
      - --store_container_labels=false          # suppress Docker label bloat on every metric
      - --housekeeping_interval=30s             # scrape every 30 s (matches Prometheus)
      - --max_housekeeping_interval=35s
      - --disable_metrics=advtcp,cpuset,hugetlb,referenced_memory,resctrl,tcp,udp
    networks:
      - backend

  # Host CPU / memory / disk / network (the host itself, not its containers).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    mem_limit: 64m
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)($$|/)'
    volumes:
      - /:/host:ro,rslave
    networks:
      - backend

  # Docker socket proxy: rewrites Traefik's hardcoded API v1.24 → v1.41 so it
  # works with OrbStack (which rejects anything below 1.40). Only Traefik
  # connects to this proxy; it should never be exposed to other services.
  socket-proxy:
    mem_limit: 32m
    image: nginx:alpine
    restart: always
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./traefik/socket-proxy.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge

  # Edge proxy: TLS termination, HTTP→HTTPS redirect, security headers,
  # edge rate limiting, and routing to api-gateway / admin tools.
  # Requires DOMAIN and ACME_EMAIL in .env.
  # On first deploy: touch traefik/acme.json && chmod 600 traefik/acme.json
  traefik:
    mem_limit: 128m
    image: traefik:v3.7.1
    restart: always
    ports:
      - "80:80"
      - "443:443"
      # Local dev: Traefik dashboard at http://localhost:8090/dashboard/
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:8090:8090"
    volumes:
      # No docker.sock mount here — traffic goes through socket-proxy instead.
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/acme.json:/acme/acme.json
    networks:
      - edge
    depends_on:
      socket-proxy:
        condition: service_started
      api-gateway:
        condition: service_healthy
    labels:
      # OrbStack: forward *.orb.local traffic to port 8090 (plain HTTP, no TLS clash).
      - "dev.orbstack.http-port=8090"
      - "traefik.enable=true"
      # Traefik dashboard — restricted to private IPs only (see admin-ip-allowlist in dynamic.yml).
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=${CERT_RESOLVER:-}"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=admin-ip-allowlist@file"


networks:
  # edge: Traefik and only what it routes to. backend: services, databases,
  # brokers and workers. Traefik is never on backend, so the proxy facing the
  # internet has no route to Postgres, Redis or RabbitMQ. backend is not
  # `internal: true` because services call Stripe, CJ, OpenRouter, SMTP, Google.
  edge:
    name: edge
  backend:
    name: backend


volumes:
  postgres_data:
  product_media:
  return_evidence:
  redis_data:
  rabbitmq_data:
  prom_data:
  grafana_data:
  alertmanager_data:
  tempo_data:
